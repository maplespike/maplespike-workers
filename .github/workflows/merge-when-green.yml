# Merge when green — label-gated auto-merge.
#
# Ported from maplespike/quill .github/workflows/merge-when-green.yml, including
# the fleet-merge-gate App token metadata read from quill PR #1293.
#
# The human act is the `ready-to-merge` label. This job does not approve the
# PR. It squash-merges a same-repo PR only when that label is present, the
# `hold` label is absent, the head repository is this repository, and the
# required `ci` check is success with no pending or failing checks.
#
# Fork pull_request_target and fork workflow_run events are skipped before any
# step. The script also refuses a foreign head before it calls the API with
# the App token. This job does not check out the repository and does not run
# pull-request head code.
#
# A known skip (no label, hold, fork, draft, pending or red checks, not open)
# exits 0. An unknown state — empty head repository, unknown mergeability,
# a non-numeric count, a missing App token — exits non-zero and writes a job
# summary. It does not exit 0.
#
# pull_request_target runs the workflow file from the default branch, which is
# what gives the token its permissions. check_suite does not wake this
# workflow for a suite GitHub Actions created. workflow_run wakes the gate
# when CI completes.
name: "Merge when green"

on:
  workflow_run:
    workflows:
      - "CI"
    types: [completed]
  check_suite:
    types: [completed]
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to evaluate"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write
  actions: write

concurrency:
  group: >-
    gate-${{
      github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number)
      || (github.event.workflow_run.pull_requests[0].number && format('pr-{0}', github.event.workflow_run.pull_requests[0].number))
      || (github.event.check_suite.pull_requests[0].number && format('pr-{0}', github.event.check_suite.pull_requests[0].number))
      || (github.event.inputs.pr && format('pr-{0}', github.event.inputs.pr))
      || github.event.workflow_run.head_sha
      || github.event.check_suite.head_sha
      || format('run-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  merge:
    name: merge
    # Forks never run this job. check_suite and workflow_dispatch are not
    # fork pull_request events; the script still refuses a foreign head.
    if: >-
      (
        github.event_name != 'pull_request_target'
        || github.event.pull_request.head.repo.full_name == github.repository
      ) && (
        github.event.workflow_run.head_repository.full_name == github.repository
        || github.event_name != 'workflow_run'
      )
    # GitHub-hosted runner. Fork events are skipped by the job if above.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require merge-gate app credentials
        env:
          MERGE_GATE_APP_ID: ${{ vars.MERGE_GATE_APP_ID }}
          MERGE_GATE_APP_PRIVATE_KEY: ${{ secrets.MERGE_GATE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${MERGE_GATE_APP_ID}" ]]; then
            missing+=("MERGE_GATE_APP_ID (repository variable vars.MERGE_GATE_APP_ID)")
          fi
          if [[ -z "${MERGE_GATE_APP_PRIVATE_KEY}" ]]; then
            missing+=("MERGE_GATE_APP_PRIVATE_KEY (secret secrets.MERGE_GATE_APP_PRIVATE_KEY)")
          fi
          if (( ${#missing[@]} > 0 )); then
            {
              echo "## Merge gate credentials missing"
              echo
              echo "The merge-when-green job cannot mint a GitHub App token. Missing:"
              echo
              for item in "${missing[@]}"; do
                echo "- \`${item}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Merge gate credential missing: ${missing[*]}"
            exit 1
          fi

      # No actions/checkout. The script talks to the GitHub API only.
      # GITHUB_TOKEN cannot merge a PR that edits .github/workflows, and its
      # `gh pr view` returns headRepository null for a same-repo PR. The
      # fleet-merge-gate App token reads labels, head SHA, mergeable, and
      # check state, and it can update and squash-merge. An empty credential
      # already failed the previous step. There is no GITHUB_TOKEN fallback.
      - name: Mint merge-gate app token
        id: gate
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MERGE_GATE_APP_ID }}
          private-key: ${{ secrets.MERGE_GATE_APP_PRIVATE_KEY }}

      - name: Evaluate the gate once
        env:
          GATE_TOKEN: ${{ steps.gate.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name || github.event.check_suite.pull_requests[0].head.repo.full_name }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          PR_SHA_EVENT: ${{ github.event.pull_request.head.sha }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECK_SUITE_SHA: ${{ github.event.check_suite.head_sha }}
          WORKFLOW_RUN_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
          CHECK_SUITE_PRS: ${{ toJson(github.event.check_suite.pull_requests) }}
          GATE_JOB_NAME: merge
          GATE_WORKFLOW_NAME: Merge when green
          GATE_APP_SLUG: github-actions
          REQUIRED_CHECK_NAME: ci
        shell: bash
        run: |
          set -euo pipefail

          summarized=0
          fail_unknown() {
            local msg="$1"
            summarized=1
            echo "::error::${msg}"
            {
              echo "## Merge gate: unknown state"
              echo
              echo "${msg}"
              echo
              echo "The gate stops here and does not merge."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          trap 'status=$?; if [[ "$summarized" -eq 0 ]]; then { echo "## Merge gate failed"; echo; echo "A command failed with exit ${status} before the gate could decide."; echo; echo "The gate stops here and does not merge."; } >> "$GITHUB_STEP_SUMMARY"; echo "::error::Merge gate command failed with exit ${status}."; fi; exit "$status"' ERR

          pr_number_from_list() {
            local json="${1:-null}"
            local sha="$2"
            if [[ -z "$json" || "$json" == "null" ]]; then
              printf ''
              return 0
            fi
            jq -r --arg sha "$sha" '
              if type != "array" or length == 0 then
                empty
              else
                ([.[] | select((.head.sha // "") == $sha and $sha != "")] | first | .number)
                // (.[0].number // empty)
              end
            ' <<<"$json"
          }

          lookup_open_pr() {
            local sha="$1"
            GH_TOKEN="$READ_TOKEN" gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" \
              | jq -s -r --arg sha "$sha" '
                  [ .[][]? | select(.head.sha == $sha) | .number ] | first // empty
                '
          }

          event_head_repo() {
            local json="${1:-null}"
            if [[ -z "$json" || "$json" == "null" ]]; then
              printf ''
              return 0
            fi
            jq -r '
              if type != "array" or length == 0 then
                empty
              else
                .[0].head.repo.full_name // (
                  (.[0].head.repo.url // "")
                  | if test("repos/[^/]+/[^/]+$") then sub("^.*repos/"; "") else empty end
                )
              end
            ' <<<"$json"
          }

          require_count() {
            local label="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              fail_unknown "${label} count was not a single number."
            fi
          }

          PR_NUMBER=""
          HEAD_SHA=""

          case "$EVENT_NAME" in
            pull_request_target)
              PR_NUMBER="${PR_NUMBER_EVENT:-}"
              HEAD_SHA="${PR_SHA_EVENT:-}"
              ;;
            workflow_dispatch)
              PR_NUMBER="${DISPATCH_PR:-}"
              ;;
            workflow_run)
              HEAD_SHA="${WORKFLOW_RUN_SHA:-}"
              PR_NUMBER="$(pr_number_from_list "${WORKFLOW_RUN_PRS:-null}" "$HEAD_SHA")"
              ;;
            check_suite)
              HEAD_SHA="${CHECK_SUITE_SHA:-}"
              PR_NUMBER="$(pr_number_from_list "${CHECK_SUITE_PRS:-null}" "$HEAD_SHA")"
              ;;
            *)
              fail_unknown "Event ${EVENT_NAME} is not a merge-gate event."
              ;;
          esac

          if [[ -z "${EVENT_HEAD_REPO:-}" ]]; then
            case "$EVENT_NAME" in
              check_suite)
                EVENT_HEAD_REPO="$(event_head_repo "${CHECK_SUITE_PRS:-null}")"
                ;;
              workflow_run)
                EVENT_HEAD_REPO="$(event_head_repo "${WORKFLOW_RUN_PRS:-null}")"
                ;;
            esac
          fi
          if [[ -n "${EVENT_HEAD_REPO:-}" && "$EVENT_HEAD_REPO" != "$GH_REPO" ]]; then
            echo "::notice::Event head repository is not ${GH_REPO}. Fork PRs are excluded."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request_target" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$ACTOR" in
              "dependabot[bot]"|"app/dependabot"|reverb256)
                ;;
              *)
                echo "::notice::Actor is not on the merge allowlist."
                exit 0
                ;;
            esac
          fi

          if [[ -z "${GATE_TOKEN:-}" ]]; then
            fail_unknown "GitHub App token is empty. vars.MERGE_GATE_APP_ID and secrets.MERGE_GATE_APP_PRIVATE_KEY did not mint a token."
          fi
          READ_TOKEN="$GATE_TOKEN"

          if [[ -n "${HEAD_SHA:-}" && ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            fail_unknown "Head SHA is not a 40-character commit id."
          fi

          if [[ -z "${PR_NUMBER:-}" && -n "${HEAD_SHA:-}" ]]; then
            PR_NUMBER="$(lookup_open_pr "$HEAD_SHA")"
          fi

          if [[ -z "${PR_NUMBER:-}" ]]; then
            case "$EVENT_NAME" in
              pull_request_target|workflow_dispatch)
                fail_unknown "Pull request number was empty."
                ;;
            esac
            echo "::notice::No open PR resolved for this event."
            exit 0
          fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            fail_unknown "PR number is not numeric."
          fi

          fetch_meta() {
            META="$(GH_TOKEN="$READ_TOKEN" gh pr view "$PR_NUMBER" --repo "$GH_REPO" \
              --json state,isDraft,mergeable,mergeStateStatus,headRepository,headRefOid,labels,author,body)"
          }
          fetch_meta

          known_skip() {
            if [[ "$(jq -r '.state' <<<"$META")" != "OPEN" ]]; then
              echo "::notice::PR #${PR_NUMBER} is not open."
              exit 0
            fi
            if [[ "$(jq -r '.isDraft' <<<"$META")" == "true" ]]; then
              echo "::notice::PR #${PR_NUMBER} is a draft."
              exit 0
            fi
            local author
            author="$(jq -r '.author.login // empty' <<<"$META")"
            case "$author" in
              "dependabot[bot]"|"app/dependabot"|reverb256)
                ;;
              *)
                echo "::notice::PR author is not on the merge allowlist."
                exit 0
                ;;
            esac
            if [[ "$(jq -r 'any(.labels[]; .name == "hold")' <<<"$META")" == "true" ]]; then
              echo "::notice::PR #${PR_NUMBER} has the hold label."
              exit 0
            fi
            if [[ "$(jq -r 'any(.labels[]; .name == "ready-to-merge")' <<<"$META")" != "true" ]]; then
              echo "::notice::PR #${PR_NUMBER} does not have the ready-to-merge label."
              exit 0
            fi
            local head_repo
            head_repo="$(jq -r '.headRepository.nameWithOwner // empty' <<<"$META")"
            if [[ -n "$head_repo" && "$head_repo" != "$GH_REPO" ]]; then
              echo "::notice::PR #${PR_NUMBER} head repository is not ${GH_REPO}. Fork PRs are excluded."
              exit 0
            fi
          }
          known_skip

          for try in 1 2 3 4 5; do
            head_now="$(jq -r '.headRepository.nameWithOwner // empty' <<<"$META")"
            mergeable_now="$(jq -r '.mergeable // "UNKNOWN"' <<<"$META")"
            if [[ -n "$head_now" && "$mergeable_now" != "UNKNOWN" && "$mergeable_now" != "null" && -n "$mergeable_now" ]]; then
              break
            fi
            if [[ "$try" -lt 5 ]]; then
              echo "::notice::PR #${PR_NUMBER} head repository or mergeable state is not computed yet (try ${try}/5)."
              sleep $((try * 10))
              fetch_meta
              known_skip
            fi
          done

          HEAD_REPO="$(jq -r '.headRepository.nameWithOwner // empty' <<<"$META")"
          if [[ -z "$HEAD_REPO" ]]; then
            fail_unknown "PR #${PR_NUMBER} head repository is empty after retries."
          fi
          if [[ "$HEAD_REPO" != "$GH_REPO" ]]; then
            echo "::notice::PR #${PR_NUMBER} head repository is not ${GH_REPO}. Fork PRs are excluded."
            exit 0
          fi

          LIVE_SHA="$(jq -r '.headRefOid // empty' <<<"$META")"
          if [[ -z "${HEAD_SHA:-}" ]]; then
            HEAD_SHA="$LIVE_SHA"
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ || ! "$LIVE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            fail_unknown "PR #${PR_NUMBER} head SHA is not a 40-character commit id."
          fi
          if [[ "$LIVE_SHA" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #${PR_NUMBER} moved past the event SHA."
            exit 0
          fi

          echo "::notice::Resolved PR #${PR_NUMBER}."

          CHECKS="$(GH_TOKEN="$READ_TOKEN" gh api --paginate "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            | jq -s \
              --arg job "$GATE_JOB_NAME" \
              --arg workflow "$GATE_WORKFLOW_NAME" \
              --arg run_id "$RUN_ID" \
              --arg app "$GATE_APP_SLUG" \
              --arg required "$REQUIRED_CHECK_NAME" '
                def is_gate:
                  (
                    ((.name == $job) or (.name == $workflow))
                    and ((.app.slug // $app) == $app)
                  )
                  or ((.details_url // "") | contains("/actions/runs/" + $run_id + "/"))
                  or ((.html_url // "") | contains("/actions/runs/" + $run_id + "/"));
                [ .[].check_runs[]? | select(is_gate | not) | select(.conclusion != "stale") ] as $runs
                | {
                    pending: [$runs[] | select(.status != "completed")] | length,
                    red: [$runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length,
                    green: [$runs[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral"))] | length,
                    ci_success: [$runs[] | select(.name == $required and .status == "completed" and .conclusion == "success")] | length,
                    pending_names: [$runs[] | select(.status != "completed") | .name] | unique | join(", "),
                    red_names: [$runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")) | .name] | unique | join(", ")
                  }
              ')"

          STATUSES="$(GH_TOKEN="$READ_TOKEN" gh api --paginate "repos/${GH_REPO}/commits/${HEAD_SHA}/statuses?per_page=100" \
            | jq -s '
                [ .[][]? ]
                | group_by(.context)
                | map(max_by(.updated_at // .created_at // ""))
                | {
                    pending: map(select(.state == "pending")) | length,
                    red: map(select(.state == "failure" or .state == "error")) | length,
                    green: map(select(.state == "success")) | length
                  }
              ')"

          PENDING="$(jq -r '.pending' <<<"$CHECKS")"
          RED="$(jq -r '.red' <<<"$CHECKS")"
          GREEN="$(jq -r '.green' <<<"$CHECKS")"
          CI_SUCCESS="$(jq -r '.ci_success' <<<"$CHECKS")"
          S_PENDING="$(jq -r '.pending' <<<"$STATUSES")"
          S_RED="$(jq -r '.red' <<<"$STATUSES")"
          S_GREEN="$(jq -r '.green' <<<"$STATUSES")"
          require_count "check pending" "$PENDING"
          require_count "check red" "$RED"
          require_count "check green" "$GREEN"
          require_count "required check success" "$CI_SUCCESS"
          require_count "status pending" "$S_PENDING"
          require_count "status red" "$S_RED"
          require_count "status green" "$S_GREEN"

          if [[ "$PENDING" -gt 0 || "$RED" -gt 0 || "$S_PENDING" -gt 0 || "$S_RED" -gt 0 ]]; then
            echo "::notice::Checks for this SHA are pending or failing. Nothing to merge."
            exit 0
          fi
          if [[ "$GREEN" -eq 0 && "$S_GREEN" -eq 0 ]]; then
            echo "::notice::No completed checks for this SHA yet."
            exit 0
          fi
          if [[ "$CI_SUCCESS" -eq 0 ]]; then
            echo "::notice::Required check ${REQUIRED_CHECK_NAME} is not success."
            exit 0
          fi

          MERGE_STATE="$(jq -r '.mergeStateStatus // empty' <<<"$META")"
          MERGEABLE="$(jq -r '.mergeable // empty' <<<"$META")"
          if [[ "$MERGE_STATE" == "BEHIND" ]]; then
            echo "::notice::PR #${PR_NUMBER} is behind base. Updating the branch once."
            if ! GH_TOKEN="$GATE_TOKEN" gh pr update-branch "$PR_NUMBER" --repo "$GH_REPO"; then
              fail_unknown "PR #${PR_NUMBER} is behind base and the branch update failed."
            fi
            exit 0
          fi
          case "$MERGEABLE" in
            MERGEABLE)
              ;;
            CONFLICTING)
              echo "::notice::PR #${PR_NUMBER} has merge conflicts."
              exit 0
              ;;
            UNKNOWN|null|"")
              fail_unknown "PR #${PR_NUMBER} mergeable state is unknown after retries."
              ;;
            *)
              fail_unknown "PR #${PR_NUMBER} mergeable state is unrecognized."
              ;;
          esac
          case "$MERGE_STATE" in
            CLEAN|UNSTABLE|BLOCKED|HAS_HOOKS)
              ;;
            DRAFT|DIRTY)
              echo "::notice::PR #${PR_NUMBER} merge state is ${MERGE_STATE}."
              exit 0
              ;;
            UNKNOWN|"")
              fail_unknown "PR #${PR_NUMBER} merge state is unknown after retries."
              ;;
            *)
              fail_unknown "PR #${PR_NUMBER} merge state is unrecognized."
              ;;
          esac

          BODY_FILE="${RUNNER_TEMP}/pr-body"
          jq -r '.body // ""' <<<"$META" > "$BODY_FILE"

          echo "::notice::Squash-merging PR #${PR_NUMBER}."
          GH_TOKEN="$GATE_TOKEN" gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --body-file "$BODY_FILE"
          echo "::notice::Merged #${PR_NUMBER} via the ready-to-merge gate."

          echo "Dispatching CI on main after merge."
          if GH_TOKEN="$GH_TOKEN" gh workflow run CI --repo "$GH_REPO" --ref main; then
            echo "::notice::Dispatched CI on main after #${PR_NUMBER} merged."
          else
            echo "::warning::Failed to dispatch CI on main after #${PR_NUMBER} merged."
          fi

          echo "Close-loop: scanning the PR body for closing keywords."
          if grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*(GH)?#[0-9]+' "$BODY_FILE"; then
            while IFS= read -r n; do
              if [[ ! "$n" =~ ^[0-9]+$ ]]; then
                continue
              fi
              if ! state="$(GH_TOKEN="${GH_TOKEN}" gh issue view "$n" --repo "$GH_REPO" --json state -q .state 2>&1)"; then
                echo "::warning::Close-loop could not read the state of #${n}."
                continue
              fi
              case "$state" in
                OPEN)
                  if GH_TOKEN="${GH_TOKEN}" gh issue close "$n" --repo "$GH_REPO" --reason completed \
                    --comment "Closed by the ready-to-merge gate when #${PR_NUMBER} merged."; then
                    echo "::notice::Close-loop closed #${n}."
                  else
                    echo "::warning::Could not close issue #${n}."
                  fi
                  ;;
                CLOSED)
                  echo "Close-loop: #${n} already closed."
                  ;;
                *)
                  echo "::warning::Close-loop could not read the state of #${n}."
                  ;;
              esac
            done < <(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*(GH)?#[0-9]+' "$BODY_FILE" | grep -oE '[0-9]+' | sort -u)
          else
            echo "Close-loop: no closing refs in the PR body."
          fi
